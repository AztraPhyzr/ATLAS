<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1eb">
  <meta name="description" content="Explore pivotal moments in modern history with History Atlas.">
  <title>History Atlas — A living timeline</title>
  <link rel="icon" type="image/png" href="history-atlas-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f1eb;
      --paper-deep: #e9e4da;
      --ink: #20211e;
      --muted: #777970;
      --line: #d8d3c9;
      --accent: #bd543a;
      --accent-dark: #923d2b;
      --white: #fffefa;
      --serif: "Playfair Display", Georgia, serif;
      --sans: "DM Sans", Arial, sans-serif;
      --mono: "DM Mono", monospace;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.6;
    }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    a { color: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid #d7795e;
      outline-offset: 3px;
    }
    .topbar {
      height: 68px;
      padding: 0 5.2vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      position: relative;
      z-index: 5;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }
    .brand-logo {
      display: block;
      width: auto;
      max-width: min(180px, 30vw);
      height: 58px;
      object-fit: contain;
    }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .language-select {
      max-width: 140px;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: var(--white);
      color: var(--ink);
      padding: 6px 8px;
      font-size: 12px;
    }
    .top-link, .account-button {
      border: 0;
      background: transparent;
      text-decoration: none;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .account-button.primary {
      background: var(--ink);
      color: var(--white);
      border-radius: 2px;
      padding: 10px 16px;
    }
    .account-button.primary:hover { background: var(--accent-dark); }
    .sidebar-toggle {
      display: grid;
      width: 38px;
      height: 38px;
      place-content: center;
      gap: 5px;
      border: 1px solid var(--line);
      background: transparent;
      padding: 0;
      cursor: pointer;
      color: var(--accent-dark);
    }
    .sidebar-toggle:hover { background: var(--white); }
    .sidebar-toggle span {
      display: block;
      width: 19px;
      height: 2px;
      background: currentColor;
    }

    .page-layout {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      max-width: 1600px;
      margin: 0 auto;
      min-height: calc(100vh - 68px);
      transition: grid-template-columns .28s ease;
    }
    .sidebar {
      min-width: 0;
      overflow: hidden;
      border-right: 1px solid var(--line);
      padding: 36px 22px 28px 5.2vw;
      transition: padding .28s ease, opacity .2s ease, border-color .28s ease, border-width .28s ease, visibility .28s linear;
    }
    .page-layout.sidebar-collapsed {
      grid-template-columns: 0fr minmax(0, 1fr);
    }
    .page-layout.sidebar-collapsed .sidebar {
      padding-right: 0;
      padding-left: 0;
      border-right-width: 0;
      border-color: transparent;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }
    .sidebar-heading, .eyebrow {
      margin: 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .12em;
      line-height: 1.5;
      text-transform: uppercase;
    }
    .sidebar-heading { margin: 0 0 14px 10px; }
    .event-list { display: grid; gap: 3px; }
    .event-nav {
      display: grid;
      grid-template-columns: 30px 1fr;
      align-items: baseline;
      width: 100%;
      padding: 9px 10px;
      border: 0;
      border-radius: 2px;
      background: transparent;
      text-align: left;
      cursor: pointer;
      color: #4c4d47;
      font-size: 12px;
      transition: background .18s, color .18s;
    }
    .event-nav:hover { background: #e9e4da; color: var(--ink); }
    .event-nav[aria-current="true"] {
      background: var(--white);
      color: var(--accent-dark);
      font-weight: 700;
    }
    .event-nav.contribution-nav {
      grid-template-columns: 30px 1fr;
      padding: 9px 10px;
      color: #4c4d47;
      font-size: 12px;
    }
    .event-nav.contribution-nav:hover { background: #e9e4da; color: var(--ink); }
    .event-nav span:last-child {
      min-width: 0;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: normal;
    }
    .event-index { color: #99988f; font: 10px var(--mono); }
    .sidebar-note {
      margin: 34px 10px 0;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
    }
    .sidebar-contributions {
      display: grid;
      gap: 9px;
      margin: 24px 0 0 10px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .sidebar-contributions[hidden] { display: none; }
    .sidebar-contributions h2 {
      margin: 0;
      color: var(--muted);
      font: 10px/1.5 var(--mono);
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .sidebar-contribution {
      padding: 9px;
      background: var(--white);
      color: #52534d;
      font-size: 10px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .sidebar-contribution strong {
      display: block;
      margin-bottom: 2px;
      color: var(--ink);
      font: 500 14px/1.3 var(--serif);
    }
    .sidebar-contribution time {
      color: var(--accent-dark);
      font: 9px var(--mono);
    }
    .sidebar-contribution p { margin: 5px 0 0; white-space: pre-wrap; }
    .sidebar-contribution img {
      display: block;
      width: 100%;
      max-height: 120px;
      margin-top: 7px;
      object-fit: cover;
    }

    main { min-width: 0; padding: 0 5.2vw 70px; }
    .hero {
      min-height: 360px;
      margin: 0 -5.2vw;
      padding: 46px 5.2vw 36px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(23, 24, 21, .17), rgba(23, 24, 21, .62)),
        linear-gradient(135deg, #777b72, #aaa08d 55%, #5f6862);
      background-size: cover;
      background-position: center 46%;
      color: white;
      text-align: center;
      transition: background-image .25s ease;
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(0,0,0,.08), transparent 48%, rgba(0,0,0,.08));
      pointer-events: none;
    }
    .hero-copy { position: relative; z-index: 1; max-width: 720px; }
    .hero .eyebrow { color: rgba(255,255,255,.8); }
    .hero h1 {
      margin: 8px 0 9px;
      font: 600 clamp(48px, 8vw, 104px)/1 var(--serif);
      letter-spacing: .075em;
    }
    .hero-subtitle {
      margin: 0 auto;
      max-width: 440px;
      color: rgba(255,255,255,.9);
      font-size: 14px;
      letter-spacing: .015em;
    }
    .hero-credit {
      position: absolute;
      z-index: 2;
      right: 5.2vw;
      bottom: 14px;
      color: rgba(255,255,255,.8);
      font: 9px var(--mono);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .intro-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 23px 0 21px;
      border-bottom: 1px solid var(--line);
    }
    .intro-row p { margin: 0; color: var(--muted); font-size: 12px; }
    .intro-row .eyebrow { color: var(--accent-dark); }
    .event-content { max-width: 970px; margin: 0 auto; }
    .event-heading {
      padding: 41px 0 20px;
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: end;
    }
    .event-heading h2 {
      margin: 5px 0 0;
      font: 600 clamp(32px, 4.4vw, 54px)/1.1 var(--serif);
      letter-spacing: -.035em;
    }
    .event-date {
      flex-shrink: 0;
      margin: 0 0 4px;
      font: 11px var(--mono);
      color: var(--accent-dark);
      text-align: right;
    }
    .event-summary {
      max-width: 760px;
      margin: 0 0 30px;
      color: #4f504a;
      font: 500 17px/1.75 var(--serif);
    }
    .facts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .fact { padding: 17px 18px 18px 0; }
    .fact + .fact { padding-left: 20px; border-left: 1px solid var(--line); }
    .fact strong {
      display: block;
      margin-bottom: 5px;
      color: var(--accent-dark);
      font: 500 18px var(--serif);
    }
    .fact span { display: block; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .section-title {
      margin: 36px 0 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }
    .section-title h3 { margin: 0; font: 600 24px var(--serif); }
    .timeline { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
    .timeline-item {
      position: relative;
      padding: 3px 16px 14px 17px;
      border-left: 1px solid #c9a394;
    }
    .timeline-item::before {
      content: "";
      position: absolute;
      left: -4px;
      top: 8px;
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
    }
    .timeline-item time { color: var(--accent-dark); font: 10px var(--mono); }
    .timeline-item p { margin: 5px 0 0; color: #585951; font-size: 11px; line-height: 1.6; }
    .gallery {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 12px;
    }
    .gallery-card {
      min-width: 0;
      margin: 0;
      background: var(--paper-deep);
    }
    .gallery-image {
      width: 100%;
      height: 190px;
      display: block;
      object-fit: cover;
      background: linear-gradient(135deg, #918a7b, #d1c6b3);
    }
    .gallery-card figcaption { padding: 9px 11px 11px; color: var(--muted); font-size: 10px; }
    .source-line {
      margin: 19px 0 0;
      color: var(--muted);
      font-size: 10px;
    }
    .source-line a { color: var(--accent-dark); text-underline-offset: 2px; }
    .user-notes { display: grid; gap: 10px; }
    .user-note {
      padding: 13px 15px;
      border-left: 2px solid var(--accent);
      background: #ebe6dc;
      color: #52534d;
      font-size: 12px;
      white-space: pre-wrap;
    }
    .user-gallery { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .user-gallery img { width: 110px; height: 82px; object-fit: cover; }
    .community-incidents { display: grid; gap: 12px; }
    .community-incident {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 150px;
      gap: 14px;
      padding: 14px;
      border: 1px solid var(--line);
      background: var(--white);
    }
    .community-incident h4 { margin: 0 0 3px; font: 600 18px var(--serif); }
    .community-incident time { color: var(--accent-dark); font: 10px var(--mono); }
    .community-incident p { margin: 8px 0 0; color: #52534d; font-size: 12px; white-space: pre-wrap; }
    .community-incident img { width: 100%; height: 110px; object-fit: cover; }
    .editor-link {
      border: 1px solid var(--line);
      background: transparent;
      padding: 8px 12px;
      color: var(--accent-dark);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }
    .editor-link:hover { background: var(--white); }
    footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 50px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
    }

    .chat-launcher {
      position: fixed;
      z-index: 10;
      right: 24px;
      bottom: 24px;
      display: inline-flex;
      gap: 9px;
      align-items: center;
      padding: 13px 17px;
      border: 0;
      border-radius: 30px;
      background: var(--ink);
      color: white;
      box-shadow: 0 8px 28px rgba(30,30,26,.2);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .chat-launcher:hover { background: var(--accent-dark); }
    .chat-dot { width: 7px; height: 7px; border-radius: 50%; background: #89c9a0; }
    .chat-panel {
      position: fixed;
      z-index: 11;
      right: 24px;
      bottom: 82px;
      width: min(360px, calc(100vw - 32px));
      height: 430px;
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--white);
      box-shadow: 0 14px 50px rgba(30,30,26,.18);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(14px) scale(.98);
      transform-origin: bottom right;
      transition: opacity .2s ease, transform .2s ease, visibility .2s;
    }
    .chat-panel.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }
    .chat-header { padding: 15px 17px; background: var(--ink); color: white; }
    .chat-header strong { display: block; font: 500 17px var(--serif); }
    .chat-header span { color: #c7c6bd; font-size: 10px; }
    .chat-messages { display: flex; flex-direction: column; gap: 9px; overflow-y: auto; padding: 14px; }
    .chat-message {
      max-width: 88%;
      padding: 9px 11px;
      background: #f0ede6;
      color: #454640;
      font-size: 11px;
