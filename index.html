<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>History Atlas</title>
    <style>
      :root {
        --paper: #f4f1eb;
        --line: #d8d3c9;
        --ink: #20211e;
        --accent: #bd543a;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--paper);
        color: var(--ink);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 68px;
        padding: 0 24px;
        border-bottom: 1px solid var(--line);
        background: var(--paper);
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .sidebar-toggle {
        width: 38px;
        height: 38px;
        border: 1px solid var(--line);
        background: transparent;
        display: grid;
        place-content: center;
        gap: 5px;
        cursor: pointer;
      }

      .sidebar-toggle span {
        display: block;
        width: 18px;
        height: 2px;
        background: var(--ink);
      }

      .page-layout {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr);
        min-height: calc(100vh - 68px);
        transition: grid-template-columns 0.25s ease;
      }

      .page-layout.sidebar-collapsed {
        grid-template-columns: 0 minmax(0, 1fr);
      }

      .sidebar {
        border-right: 1px solid var(--line);
        padding: 20px 16px;
        transition: opacity 0.2s ease, visibility 0.2s ease;
      }

      .page-layout.sidebar-collapsed .sidebar {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .sidebar nav {
        display: grid;
        gap: 8px;
      }

      .sidebar button {
        border: 0;
        background: transparent;
        text-align: left;
        padding: 8px 10px;
        cursor: pointer;
      }

      main {
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">History Atlas</div>
      <div class="top-actions">
        <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Hide chapters" aria-expanded="false" title="Hide chapters">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <div class="page-layout sidebar-collapsed" id="pageLayout">
      <aside class="sidebar" aria-label="Chapter list">
        <nav>
          <button type="button">French Revolution</button>
          <button type="button">Industrial Revolution</button>
          <button type="button">World War I</button>
          <button type="button">Cold War</button>
        </nav>
      </aside>

      <main>
        <h1>History Atlas</h1>
        <p>Select a chapter to explore the story.</p>
      </main>
    </div>

    <script>
      (() => {
        const pageLayout = document.getElementById('pageLayout');
        const sidebarToggle = document.getElementById('sidebarToggle');

        function setSidebarState(isCollapsed) {
          pageLayout.classList.toggle('sidebar-collapsed', isCollapsed);
          sidebarToggle.setAttribute('aria-expanded', String(!isCollapsed));
          sidebarToggle.setAttribute('aria-label', isCollapsed ? 'Show chapters' : 'Hide chapters');
          sidebarToggle.setAttribute('title', isCollapsed ? 'Show chapters' : 'Hide chapters');
        }

        if (sidebarToggle && pageLayout) {
          setSidebarState(true);
          sidebarToggle.addEventListener('click', () => {
            const isCollapsed = pageLayout.classList.contains('sidebar-collapsed');
            setSidebarState(!isCollapsed);
          });
        }
      })();
    </script>
  </body>
</html>
